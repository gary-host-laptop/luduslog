{{define "content"}}
<div class="card" style="max-width:560px;margin:3rem auto;text-align:center">
  <div class="muted" style="font-size:4rem;font-weight:800;line-height:1">{{.Code}}</div>
  <h1>{{if eq .Code 404}}Not found{{else}}Something went wrong{{end}}</h1>
  <p class="muted">{{if eq .Code 404}}That page doesn't exist, or it isn't yours to see.{{else}}The error has been logged. Try again, or head home.{{end}}</p>
  <div class="btn-group mt2"><a class="btn" href="/">Home</a><a class="btn" href="/games">Browse games</a></div>
</div>
{{end}}
