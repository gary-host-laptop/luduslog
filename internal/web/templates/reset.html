{{define "content"}}
<div style="max-width:420px;margin:2rem auto">
  <h1>Choose a new password</h1>
  {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
  <form class="card stack" method="post" action="/reset">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="token" value="{{.Query.Get "token"}}">
    <div><label for="password">New password</label><input id="password" type="password" name="password" required minlength="10" autocomplete="new-password"></div>
    <div><label for="confirm">Confirm password</label><input id="confirm" type="password" name="confirm" required autocomplete="new-password"></div>
    <button class="btn btn-primary btn-block" type="submit">Change password</button>
  </form>
</div>
{{end}}
