{{define "content"}}
<div style="max-width:420px;margin:2rem auto">
  <h1>Log in</h1>
  {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
  <form class="card stack" method="post" action="/login">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Next}}">
    <div><label for="identifier">Username or email</label><input id="identifier" type="text" name="identifier" value="{{.Identifier}}" required autofocus autocomplete="username"></div>
    <div><label for="password">Password</label><input id="password" type="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
    <div class="row between" style="font-size:.85rem"><a href="/forgot">Forgot password?</a><a href="/register">Create an account</a></div>
  </form>
</div>
{{end}}
